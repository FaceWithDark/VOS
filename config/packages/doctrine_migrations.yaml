doctrine_migrations:
  migrations_paths:
    'DoctrineMigrations\Tourney': "%kernel.project_dir%/migrations/Tourney"
    'DoctrineMigrations\Web': "%kernel.project_dir%/migrations/Web"
    'DoctrineMigrations\Catalog': "%kernel.project_dir%/migrations/Catalog"
    'DoctrineMigrations\Xternal': "%kernel.project_dir%/migrations/Xternal"

  organize_migrations: "BY_YEAR_AND_MONTH"
  all_or_nothing: true
  check_database_platform: true
  transactional: true

  enable_profiler: false
