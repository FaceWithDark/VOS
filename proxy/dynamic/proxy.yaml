http:
  routers:
    vos-traefik-router:
      entryPoints:
        - "web"
      # NOTE:
      # We leverages our registered domain to minimal the amount of modify
      # needed when setting up on the production server.
      rule: "Host(`proxy.dev.vososu.site`)"
      service: api@internal
      # NOTE:
      # Refer to our Domain Specificity guideline for more details
      priority: 340
