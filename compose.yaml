name: VOS

services:
  backend:
    container_name: vos-symfony
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/symfony.Dockerfile
    volumes:
      # NOTE:
      # Use on 'dev' for live changes only
      - type: bind
        source: ./
        target: /var/www/app
      # NOTE:
      # This will boost the development process in Symfony Docker container since
      # it doesn't have to keep track of those 2 heavy directorie every time the
      # CLI detected files change anymore. Files within those directories are
      # normally generated by Symfony itself.
      - type: volume
        source: vos-symfony-vendor
        target: /app/vendor
      - type: volume
        source: vos-symfony-var
        target: /app/var
    ports:
      - name: vos-symfony-php # It just PHP CLI command under the hood
        target: 8000
        host_ip: 127.0.0.1
        published: "8001"
        protocol: tcp
        app_protocol: http
        mode: host
    networks:
      - vos-backend

  database:
    container_name: vos-postgres
    restart: unless-stopped
    # Set shared memory limit when using docker compose
    shm_size: 128mb
    secrets:
      - source: vos-postgres-user
        target: usr.txt
      - source: vos-postgres-database
        target: db.txt
      - source: vos-postgres-password
        target: pwd.txt
    environment:
      POSTGRES_USER_FILE: /run/secrets/usr.txt
      POSTGRES_DB_FILE: /run/secrets/db.txt
      POSTGRES_PASSWORD_FILE: /run/secrets/pwd.txt
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/postgres.Dockerfile
    volumes:
      - type: volume
        source: vos-postgres-data
        target: /var/lib/postgresql
    networks:
      - vos-backend

volumes:
  # NOTE: data will be stored from the hosting machine rather than inside
  # container due to disadvantage of Docker Overlay2 (on prod only)
  vos-postgres-data:
    name: vos-database-relational
  # NOTE: as explained above, define this only in dev (delete on prod).
  vos-symfony-vendor:
    name: vos-ignore
  vos-symfony-var:
    name: vos-ignore

networks:
  vos-backend:
    name: vososu
    driver: bridge

secrets:
  vos-postgres-user:
    file: ./docker/secrets/postgres_usr.txt
  vos-postgres-database:
    file: ./docker/secrets/postgres_db.txt
  vos-postgres-password:
    file: ./docker/secrets/postgres_pwd.txt
