name: VOS

services:
  app:
    container_name: vos-symfony
    depends_on:
      database:
        restart: true
        condition: service_started
        required: true
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/symfony.Dockerfile
    volumes:
      # NOTE:
      # Use on 'dev' for live changes only
      - type: bind
        source: ./
        target: /var/www/app
    ports:
      - name: vos-symfony-php # It just PHP CLI command under the hood
        target: 8000
        host_ip: 127.0.0.1
        published: "8001"
        protocol: tcp
        app_protocol: http
        mode: host
    networks:
      - vos-network

  database:
    container_name: vos-postgres
    restart: unless-stopped
    # Set shared memory limit when using docker compose
    shm_size: 128mb
    secrets:
      - source: vos-postgres-user
        target: usr.txt
      - source: vos-postgres-database
        target: db.txt
      - source: vos-postgres-password
        target: pwd.txt
    environment:
      POSTGRES_USER_FILE: /run/secrets/usr.txt
      POSTGRES_DB_FILE: /run/secrets/db.txt
      POSTGRES_PASSWORD_FILE: /run/secrets/pwd.txt
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/postgres.Dockerfile
    volumes:
      - type: volume
        source: vos-postgres-data
        target: /var/lib/postgresql
    networks:
      - vos-network

  # NOTE:
  # I'd love to use phpPgAdmin instead of the original one so that if we get into
  # some niche issues, we can always go inside the container and debug using PHP
  # rather than Python. However, the project seems to be abandoned (there's an
  # active fork to make it alive again but it's still relatively new) so we're
  # sticking to the original for the time being.
  database-gui:
    container_name: vos-pgadmin
    restart: unless-stopped
    secrets:
      - source: vos-pgadmin-password
        target: pwd.txt
    environment:
      # NOTE:
      # make sure to enable 2FA for this account on prod
      PGADMIN_DEFAULT_EMAIL: vososu@proton.me # Change this to your personal/work/org email
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pwd.txt
    configs:
      - source: vos-pgadmin-server
        target: /pgadmin4/servers.json
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/pgadmin.Dockerfile
    volumes:
      - type: volume
        source: vos-pgadmin-data
        target: /var/lib/pgadmin
    ports:
      - name: vos-pgadmin-gunicorn
        target: 80
        host_ip: 127.0.0.1
        published: "5051"
        protocol: tcp
        app_protocol: http
        mode: host
    networks:
      - vos-network

  proxy:
    container_name: vos-traefik
    depends_on:
      app:
        restart: true
        condition: service_started
        required: true
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/dockerfiles/traefik.Dockerfile
    volumes:
      - type: bind
        source: ./proxy/traefik.yaml
        target: /etc/traefik/traefik.yaml
      - type: bind
        source: ./proxy/dynamic/
        target: /etc/traefik/dynamic/
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    ports:
      - name: vos-traefik-proxy
        target: 80
        host_ip: 127.0.0.1
        published: "80"
        protocol: tcp
        app_protocol: http
        mode: host
      # NOTE:
      # Use on 'dev' to know which configs applied to each Docker service only
      - name: vos-traefik-dashboard
        target: 8080
        host_ip: 127.0.0.1
        published: "8081"
        protocol: tcp
        app_protocol: http
        mode: host
    networks:
      - vos-network

volumes:
  # NOTE:
  # data will be stored from the hosting machine rather than inside container due
  # to disadvantage of Docker Overlay2 (on prod only)
  vos-postgres-data:
    name: vos-database-relational
  vos-pgadmin-data:
    name: vos-database-gui

networks:
  vos-network:
    name: vososu
    driver: bridge

secrets:
  vos-postgres-user:
    file: ./docker/secrets/postgres_usr.txt
  vos-postgres-database:
    file: ./docker/secrets/postgres_db.txt
  vos-postgres-password:
    file: ./docker/secrets/postgres_pwd.txt
  vos-pgadmin-password:
    file: ./docker/secrets/pgadmin_pwd.txt

configs:
  vos-pgadmin-server:
    file: ./docker/configs/pgadmin_svr.json
